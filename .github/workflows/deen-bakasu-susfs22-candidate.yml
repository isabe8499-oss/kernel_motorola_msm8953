name: Deen BakaSU + SUSFS v2.2 + pidfd backport GCC 4.9

on:
  push:
    branches:
      - deen-bakasu-susfs22-root-preserve
      - backport/pidfd-bakasu-susfs22
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bakasu:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev make python3 git curl cpio zip

      - name: Install and verify GCC 4.9 toolchain
        run: |
          set -euo pipefail
          git clone --depth=1 --branch master https://github.com/KudProject/aarch64-linux-android-4.9.git toolchain
          test -x toolchain/bin/aarch64-linux-android-gcc
          mkdir -p artifacts
          toolchain/bin/aarch64-linux-android-gcc --version | sed -n '1p' | tee artifacts/toolchain-version.txt

      - name: Integrate BakaSU source
        run: |
          set -euo pipefail
          BAKASU_COMMIT=7c383cfeef3a2ac450f2f1273dae74bd50356d31
          curl -fsSL "https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKASU_COMMIT}/kernel/setup.sh" -o /tmp/bakasu-setup.sh
          sh /tmp/bakasu-setup.sh "${BAKASU_COMMIT}"
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          ACTUAL_COMMIT="$(git -C KernelSU rev-parse HEAD)"
          echo "${ACTUAL_COMMIT}" | tee bakasu-source-commit.txt
          test "${ACTUAL_COMMIT}" = "${BAKASU_COMMIT}"

      - name: Decouple SUSFS feature flag from the mutually-exclusive hooking method
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          kp = Path("KernelSU/kernel/Kconfig")
          k = kp.read_text()
          if "config KSU_SUSFS_INLINE_HOOK" not in k:
              start = k.find("config KSU_SUSFS\n")
              end = k.find("endchoice", start)
              if start < 0 or end < 0:
                  raise SystemExit("Could not locate SUSFS-inline entry in BakaSU Kconfig")
              block = k[start:end]
              if 'bool "SUSFS Inline Hook"' not in block:
                  raise SystemExit("Unexpected KSU_SUSFS Kconfig block; refusing rewrite")
              block = block.replace("config KSU_SUSFS", "config KSU_SUSFS_INLINE_HOOK", 1)
              block = block.replace('bool "SUSFS Inline Hook"', 'bool "SUSFS Inline Hook method"', 1)
              k = k[:start] + block + k[end:]
              anchor = 'endchoice\n\nmenu "KernelSU - Manual Hook Auto hook"'
              if k.count(anchor) != 1:
                  raise SystemExit("Could not locate end of BakaSU hook-method choice")
              feature = """config KSU_SUSFS
              bool "SUSFS kernel features (compatible with Manual Hook)"
              depends on KSU && THREAD_INFO_IN_TASK && 64BIT
              default n
              help
                  Enable SUSFS kernel-side functionality independently from the exclusive hook-method choice.
                  This lets legacy kernels retain the proven KSU_MANUAL_HOOK root path.

          """
              k = k.replace(anchor, "endchoice\n\n" + feature + 'menu "KernelSU - Manual Hook Auto hook"', 1)
              kp.write_text(k)

          bp = Path("KernelSU/kernel/Kbuild")
          b = bp.read_text()
          start = b.find("else ifdef CONFIG_KSU_SUSFS\n")
          end_marker = "endif\n\nifndef CONFIG_KSU_TRACEPOINT_HOOK"
          end = b.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate BakaSU hook-method branch in Kbuild")
          chain = """else ifdef CONFIG_KSU_SUSFS_INLINE_HOOK
            $(info -- $(REPO_NAME): using SUSFS Inline Hook method)
            include $(KSU_SRC)/tools/inline_hook_check.mk
          else
            ifeq ($(CONFIG_KSU),y)
              $(error Unsupported hook method)
            endif
          endif

          # SUSFS is independent from the mutually-exclusive hook-method choice.
          ifdef CONFIG_KSU_SUSFS
            include $(KSU_SRC)/tools/susfs_compat.mk
            ifeq ($(shell test -e $(srctree)/fs/susfs.c; echo $$?),0)
              SUSFS_VERSION := $(shell cat $(srctree)/include/linux/susfs.h | grep -E '^#define SUSFS_VERSION' | cut -d' ' -f3 | sed 's/"//g')
              $(info -- SUSFS_VERSION: $(SUSFS_VERSION))
            else
              $(info -- SUSFS core fs/susfs.c is missing)
              $(error SUSFS is enabled but the kernel-side SUSFS core was not integrated)
            endif
          endif

          """
          b = b[:start] + chain + b[end + len("endif\n\n"):]
          if "else ifdef CONFIG_KSU_SUSFS_INLINE_HOOK" not in b:
              raise SystemExit("Failed to rename SUSFS inline hook method in Kbuild")
          if b.count("include $(KSU_SRC)/tools/susfs_compat.mk") != 1:
              raise SystemExit("Expected exactly one SUSFS compatibility include")
          bp.write_text(b)
          print("SUSFS feature separated from hook method; manual root hooks remain selected.")
          PY
          grep -q 'config KSU_SUSFS_INLINE_HOOK' KernelSU/kernel/Kconfig
          grep -q 'config KSU_SUSFS$' KernelSU/kernel/Kconfig
          grep -q 'else ifdef CONFIG_KSU_SUSFS_INLINE_HOOK' KernelSU/kernel/Kbuild
          grep -q 'include $(KSU_SRC)/tools/manual_hook_check.mk' KernelSU/kernel/Kbuild
          grep -q 'include $(KSU_SRC)/tools/susfs_compat.mk' KernelSU/kernel/Kbuild

      - name: Integrate legacy execve hooks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("fs/exec.c")
          s = p.read_text()

          marker = """static int do_execve_common(struct filename *filename,
          				struct user_arg_ptr argv,
          				struct user_arg_ptr envp)
          {"""
          replacement = """#ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
          				void *argv, void *envp, int *flags);
          extern int ksu_handle_post_execveat(int *fd, struct filename **filename_ptr,
          				void *argv, void *envp, int *flags, int *retval);
          #endif

          static int do_execve_common(struct filename *filename,
          				struct user_arg_ptr argv,
          				struct user_arg_ptr envp)
          {"""
          assert s.count(marker) == 1, "do_execve_common marker not unique; refusing unsafe patch"
          s = s.replace(marker, replacement, 1)

          old_vars = """	int retval;
          	bool is_su;

          	if (IS_ERR(filename))
          		return PTR_ERR(filename);"""
          new_vars = """	int retval;
          	bool is_su;
          #ifdef CONFIG_KSU_MANUAL_HOOK
          	int ksu_fd = AT_FDCWD;
          	int ksu_flags = 0;
          #endif

          	if (IS_ERR(filename))
          		return PTR_ERR(filename);

          #ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_execveat(&ksu_fd, &filename, &argv, &envp, &ksu_flags);
          #endif"""
          assert s.count(old_vars) == 1, "execve local/guard block not unique; refusing unsafe patch"
          s = s.replace(old_vars, new_vars, 1)

          success = """	free_bprm(bprm);
          	putname(filename);
          	if (displaced)"""
          success_new = """	free_bprm(bprm);
          #ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_post_execveat(&ksu_fd, &filename, &argv, &envp, &ksu_flags, &retval);
          #endif
          	putname(filename);
          	if (displaced)"""
          assert s.count(success) == 1, "success cleanup marker not unique; refusing unsafe patch"
          s = s.replace(success, success_new, 1)

          failure = """out_ret:
          	putname(filename);
          	return retval;"""
          failure_new = """out_ret:
          #ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_post_execveat(&ksu_fd, &filename, &argv, &envp, &ksu_flags, &retval);
          #endif
          	putname(filename);
          	return retval;"""
          assert s.count(failure) == 1, "failure cleanup marker not unique; refusing unsafe patch"
          s = s.replace(failure, failure_new, 1)

          p.write_text(s)
          print("Patched fs/exec.c: manual execveat pre/post hooks placed while struct filename is still valid.")
          PY
          grep -q 'ksu_handle_execveat' fs/exec.c
          grep -q 'ksu_handle_post_execveat' fs/exec.c

      - name: Integrate legacy faccessat/stat/vfs_read/reboot hooks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch_once(path, marker, replacement, label):
              p = Path(path)
              s = p.read_text()
              n = s.count(marker)
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly one marker, found {n}; refusing patch")
              p.write_text(s.replace(marker, replacement, 1))
              print(f"patched {path}: {label}")

          patch_once("fs/open.c",
          """\tunsigned int lookup_flags = LOOKUP_FOLLOW;

          \tif (mode & ~S_IRWXO)""",
          """\tunsigned int lookup_flags = LOOKUP_FOLLOW;

          #ifdef CONFIG_KSU_MANUAL_HOOK
          \t{
          \t\textern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
          \t\t\t\t\tint *mode, int *__unused_flags);
          \t\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          \t}
          #endif

          \tif (mode & ~S_IRWXO)""", "faccessat")

          patch_once("fs/stat.c",
          """\tif (flag & AT_EMPTY_PATH)
          \t\tlookup_flags |= LOOKUP_EMPTY;
          retry:""",
          """\tif (flag & AT_EMPTY_PATH)
          \t\tlookup_flags |= LOOKUP_EMPTY;

          #ifdef CONFIG_KSU_MANUAL_HOOK
          \t{
          \t\textern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          \t\tksu_handle_stat(&dfd, &filename, &flag);
          \t}
          #endif

          retry:""", "stat")

          patch_once("kernel/reboot.c",
          """\tchar buffer[256];
          \tint ret = 0;

          \t/* We only trust the superuser with rebooting the system. */""",
          """\tchar buffer[256];
          \tint ret = 0;

          #if defined(CONFIG_KSU_MANUAL_HOOK) || defined(CONFIG_KSU_SUSFS)
          \t{
          \t\textern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
          \t\tif (magic1 == 0xDEADBEEF)
          \t\t\treturn ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          \t}
          #endif

          \t/* We only trust the superuser with rebooting the system. */""", "sys_reboot")
          # Add BakaSU stat return hooks required by its compile-time checker.
          patch_once("fs/stat.c",
          """SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)
          {
          \tstruct kstat stat;
          \tint error = vfs_fstat(fd, &stat);

          \tif (!error)
          \t\terror = cp_new_stat(&stat, statbuf);

          \treturn error;
          }""",
          """SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)
          {
          \tstruct kstat stat;
          \tint error = vfs_fstat(fd, &stat);

          \tif (!error)
          \t\terror = cp_new_stat(&stat, statbuf);

          #ifdef CONFIG_KSU_MANUAL_HOOK
          \textern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);
          \tksu_handle_newfstat_ret(&fd, &statbuf);
          #endif
          \treturn error;
          }""", "newfstat_ret")

          patch_once("fs/stat.c",
          """SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)
          {
          \tstruct kstat stat;
          \tint error = vfs_fstat(fd, &stat);

          \tif (!error)
          \t\terror = cp_new_stat64(&stat, statbuf);

          \treturn error;
          }""",
          """SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)
          {
          \tstruct kstat stat;
          \tint error = vfs_fstat(fd, &stat);

          \tif (!error)
          \t\terror = cp_new_stat64(&stat, statbuf);

          #ifdef CONFIG_KSU_MANUAL_HOOK
          \textern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);
          \tksu_handle_fstat64_ret(&fd, &statbuf);
          #endif
          \treturn error;
          }""", "fstat64_ret")
          PY
          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -q 'ksu_handle_stat' fs/stat.c
          grep -q 'ksu_handle_newfstat_ret' fs/stat.c
          grep -q 'ksu_handle_fstat64_ret' fs/stat.c
          grep -q 'ksu_handle_sys_reboot' kernel/reboot.c

      - name: Download pinned SUSFS v2.2 patch and inline hooks
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CORE_COMMIT=30492fd415f12414104beb14349e83e58017dfa9
          HOOK_COMMIT=16b6032141d284423160182577fb465e55e4925d
          curl -fsSL "https://raw.githubusercontent.com/redmax19/build/$CORE_COMMIT/Patches/Patch/susfs_patch_to_4.4.patch" -o /tmp/susfs_patch_to_4.4_v22.patch
          curl -fsSL "https://raw.githubusercontent.com/kyzuna28/Compiler/$HOOK_COMMIT/hook%20v1/susfs_inline22.sh" -o susfs_inline22.sh
          sha256sum /tmp/susfs_patch_to_4.4_v22.patch susfs_inline22.sh | tee artifacts/susfs-source-sha256.txt
          printf 'Core_patch=redmax19/build@%s\nInline_hooks=kyzuna28/Compiler@%s\n' "$CORE_COMMIT" "$HOOK_COMMIT" | tee artifacts/susfs-source-commits.txt

      - name: Apply SUSFS v2.2 and Deen 3.18 compatibility adapter
        run: |
          set -euo pipefail
          set +e
          patch --batch --forward -p1 < /tmp/susfs_patch_to_4.4_v22.patch > artifacts/susfs-core-patch.log 2>&1
          core_rc=$?
          bash susfs_inline22.sh > artifacts/susfs-inline-hooks.log 2>&1
          hook_rc=$?
          set -e
          printf 'core_patch_exit=%s\ninline_hooks_exit=%s\n' "$core_rc" "$hook_rc" | tee artifacts/patch-status.txt
          test "$hook_rc" -eq 0
          python3 scripts/susfs22_deen_compat.py . artifacts
          cat artifacts/patch-status.txt
          cat artifacts/deferred-feature-contract.txt
          git diff --check

      - name: Prevent duplicate SUSFS inline calls from overriding manual root hooks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changed = []
          # The v2.2 inline script can add direct setresuid/read hooks. The
          # known-working Deen profile already handles these via BakaSU manual
          # hooks; keep only the inline-only versions from running in that mode.
          p = Path("kernel/sys.c")
          lines = p.read_text().splitlines()
          i = 0
          while i < len(lines):
              if lines[i].strip() == "#ifdef CONFIG_KSU_SUSFS":
                  j = i + 1
                  while j < len(lines) and lines[j].strip() != "#endif":
                      j += 1
                  if j < len(lines) and any("ksu_handle_setresuid" in x for x in lines[i:j+1]):
                      lines[i] = "#if defined(CONFIG_KSU_SUSFS) && !defined(CONFIG_KSU_MANUAL_HOOK)"
                      changed.append("kernel/sys.c:setresuid")
                      i = j
              i += 1
          p.write_text("\n".join(lines) + "\n")

          p = Path("fs/read_write.c")
          lines = p.read_text().splitlines()
          i = 0
          while i < len(lines):
              if lines[i].strip() == "#ifdef CONFIG_KSU":
                  j = i + 1
                  while j < len(lines) and lines[j].strip() != "#endif":
                      j += 1
                  if j < len(lines) and any("ksu_handle_sys_read(fd)" in x for x in lines[i:j+1]):
                      lines[i] = "#if defined(CONFIG_KSU) && !defined(CONFIG_KSU_MANUAL_HOOK)"
                      changed.append("fs/read_write.c:sys_read")
                      i = j
              i += 1
          p.write_text("\n".join(lines) + "\n")
          Path("artifacts/manual-inline-hook-suppression.txt").write_text(
              "\n".join(changed) + ("\n" if changed else "No duplicate direct manual/initrc hook blocks detected; manual hook path preserved.\n")
          )
          print("Manual/inline overlap audit:", changed or "no duplicate blocks found")
          PY
          cat artifacts/manual-inline-hook-suppression.txt

      - name: Audit preserved BakaSU driver-discovery hook
        run: |
          set -euo pipefail
          mkdir -p artifacts
          grep -n -B 12 -A 12 'ksu_handle_sys_reboot' kernel/reboot.c | tee artifacts/reboot-hook-check.txt
          grep -n -B 4 -A 4 'ksu_handle_execveat' fs/exec.c | tee artifacts/exec-hook-check.txt
          grep -n -B 4 -A 4 'ksu_handle_faccessat' fs/open.c | tee artifacts/faccessat-hook-check.txt
          grep -n -B 4 -A 4 'ksu_handle_stat' fs/stat.c | tee artifacts/stat-hook-check.txt
          test -s artifacts/reboot-hook-check.txt
          test -s artifacts/exec-hook-check.txt
          test -s artifacts/faccessat-hook-check.txt
          test -s artifacts/stat-hook-check.txt

      - name: Configure BakaSU manual hooks + SUSFS feature profile
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          make O=out deen_defconfig
          grep -q 'config KSU_MANUAL_HOOK' drivers/kernelsu/Kconfig
          grep -q 'config KSU_SUSFS_INLINE_HOOK' drivers/kernelsu/Kconfig
          scripts/config --file out/.config \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --enable KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            --disable KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
            --enable KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
            --enable KSU_SUSFS \
            --disable KSU_SUSFS_INLINE_HOOK \
            --disable KSU_TRACEPOINT_HOOK \
            --disable KSU_SUSFS_SUS_PATH \
            --disable KSU_SUSFS_SUS_MOUNT \
            --disable KSU_SUSFS_SUS_KSTAT \
            --disable KSU_SUSFS_OPEN_REDIRECT \
            --disable KSU_SUSFS_SUS_MAP \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          make O=out olddefconfig
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y$' out/.config
          grep -q '^# CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK is not set$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^# CONFIG_KSU_SUSFS_INLINE_HOOK is not set$' out/.config
          grep -q '^# CONFIG_KSU_TRACEPOINT_HOOK is not set$' out/.config
          grep -q '^# CONFIG_KSU_SUSFS_SUS_PATH is not set$' out/.config
          grep -q '^# CONFIG_KSU_SUSFS_SUS_MOUNT is not set$' out/.config
          grep -q '^# CONFIG_KSU_SUSFS_SUS_KSTAT is not set$' out/.config
          grep -q '^# CONFIG_KSU_SUSFS_OPEN_REDIRECT is not set$' out/.config
          grep -q '^# CONFIG_KSU_SUSFS_SUS_MAP is not set$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SPOOF_UNAME=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_ENABLE_LOG=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y

      - name: Build BakaSU manual-hook + SUSFS kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          make O=out -j"$(nproc)" Image.gz-dtb
          test -s out/arch/arm64/boot/Image.gz-dtb
          test -s out/vmlinux
          mkdir -p artifacts
          # Materialize the symbol table once; avoid nm receiving SIGPIPE from grep -q under pipefail.
          nm out/vmlinux > artifacts/vmlinux-symbols-all.txt
          grep -q ksu_handle_sys_reboot artifacts/vmlinux-symbols-all.txt
          grep -q ksu_install_fd artifacts/vmlinux-symbols-all.txt
          grep -q susfs_enable_log artifacts/vmlinux-symbols-all.txt
          # Fail the build unless both pidfd syscall entry points are linked.
          grep -q sys_pidfd_open artifacts/vmlinux-symbols-all.txt
          grep -q sys_pidfd_send_signal artifacts/vmlinux-symbols-all.txt
          grep -q susfs_spoof_uname artifacts/vmlinux-symbols-all.txt
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          mkdir -p artifacts/kernel
          cp out/arch/arm64/boot/Image.gz-dtb artifacts/kernel/
          cp out/.config artifacts/kernel.config
          nm out/vmlinux | grep -E 'susfs|ksu_handle_sys_reboot|ksu_handle_execveat|ksu_handle_post_execveat|ksu_handle_faccessat|ksu_handle_stat|ksu_install_fd' > artifacts/kernel-symbols.txt
          find out/arch/arm64/boot/dts -type f -name '*.dtb' -exec cp {} artifacts/ \; 2>/dev/null || true
          cp bakasu-source-commit.txt artifacts/
          {
            echo '## Deen BakaSU manual-hook + SUSFS v2.2 build'
            echo 'Keeps the confirmed working KSU_MANUAL_HOOK mode and enables SUSFS separately. Inline Hook and Tracepoint modes are disabled. Enabled SUSFS features: spoof uname, logging, hide SUSFS symbols and spoof cmdline/bootconfig; higher-risk VFS/path options remain disabled.'
            echo 'This is a test candidate: successful build and linked symbols do not prove runtime/boot compatibility.'
            cat artifacts/patch-status.txt
            cat artifacts/deferred-feature-contract.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package experimental TWRP ZIP (manual root + SUSFS stage 1)
        run: |
          set -euo pipefail
          AK3_COMMIT=020dfeccf9d7e962a48400fc94d3e451df92eead
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          git -C anykernel checkout --detach "$AK3_COMMIT"
          cp artifacts/kernel/Image.gz-dtb anykernel/Image.gz-dtb
          cat > anykernel/anykernel.sh <<'AK3'
          ### Deen XT1941-3 BakaSU manual-hook + SUSFS v2.2 stage-1 kernel
          properties() { '
          kernel.string=Deen BakaSU manual-hook + SUSFS v2.2 stage 1 GCC 4.9 (experimental)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=deen
          device.name2=XT1941-3
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          BLOCK=/dev/block/bootdevice/by-name/boot
          IS_SLOT_DEVICE=1
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto
          . tools/ak3-core.sh
          dump_boot
          write_boot
          AK3
          cat > anykernel/SUSFS-ROOT-STAGE1-EXPERIMENTAL.txt <<'NOTE'
          EXPERIMENTAL ROOT-PRESERVING SUSFS v2.2 STAGE-1 BUILD
          Target: Motorola One Deen / XT1941-3, Linux 3.18.140.
          Keeps CONFIG_KSU_MANUAL_HOOK and the known-working GCC 4.9 root integration.
          KSU_SUSFS is independent from the mutually exclusive hook method; inline-hook and Tracepoint modes remain disabled.
          Enabled SUSFS features: spoof uname, logging, hide SUSFS symbols, spoof cmdline/bootconfig.
          Disabled SUSFS features: SUS_PATH, SUS_MOUNT, SUS_KSTAT, OPEN_REDIRECT, SUS_MAP.
