name: Deen kernel CI (Linux 3.18)

on:
  workflow_dispatch:
  push:
    branches:
      - workflows/deen-android12-root-ci
    paths:
      - '.github/workflows/deen-kernel-ci.yml'
      - 'arch/arm64/configs/deen_defconfig'
      - 'Makefile'
      - 'Kconfig'
      - 'kernel/**'
      - 'fs/**'
      - 'security/**'
      - 'drivers/**'
      - 'include/**'

permissions:
  contents: read

concurrency:
  group: deen-kernel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deen:
    name: Build baseline and report root/SUSFS prerequisites
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ca-certificates             ccache curl flex git libelf-dev libssl-dev python3 python3-pip             unzip zip clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Verify expected target and kernel version
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^VERSION = 3$' Makefile
          grep -q '^PATCHLEVEL = 18$' Makefile
          grep -q '^SUBLEVEL = 140$' Makefile
          test -f arch/arm64/configs/deen_defconfig
          {
            echo '## Target verification'
            echo '- Device: Motorola One (deen)'
            echo '- Android target: Android 12 ROM; kernel source branch is lineage-18.1'
            echo "- Kernel source version: $(grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile | tr '\n' ' ')"
            echo '- Defconfig: arch/arm64/configs/deen_defconfig'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure and build baseline kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out deen_defconfig
          make O=out -j"$(nproc)" Image.gz dtbs
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.gz artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/dtbo.img artifacts/ 2>/dev/null || true
          find out/arch/arm64/boot/dts -type f -name '*.dtb' -exec cp {} artifacts/ \; 2>/dev/null || true
          test -s out/arch/arm64/boot/Image.gz
          {
            echo '## Build result'
            echo 'Baseline Image.gz and DTB build completed.'
            echo 'This workflow does not claim BakaSU/SUSFS integration until their patches are ported and compile-tested.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload baseline artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deen-linux-3.18.140-baseline
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
