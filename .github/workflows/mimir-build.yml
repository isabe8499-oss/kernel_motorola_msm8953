name: Mimir-Kernel

on:
  workflow_dispatch:
    inputs:
      droidspaces:
        description: 'DroidSpaces support?'
        required: true
        default: 'n'
        type: choice
        options:
          - 'y'
          - 'n'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEVICE: deen
      DEVICE_NAME: Motorola One
      KERNEL_NAME: Mimir Kernel

    steps:
      - name: Check Out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set Timezone
        run: |
          sudo ln -snf /usr/share/zoneinfo/America/Sao_Paulo /etc/localtime
          echo "America/Sao_Paulo" | sudo tee /etc/timezone

      - name: Setting up the environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu jq zip curl git make python3 perl libssl-dev libelf-dev bc

          # Creates the manual symbolic link to replace the old python-is-python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python

          # Generate environmental variables
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Verify pinned BakaSU submodule
        run: |
          # A submodule checkout stores .git as a file pointing into the superproject's .git/modules.
          test -e KernelSU/.git
          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Kbuild
          ACTUAL="$(git -C KernelSU rev-parse HEAD)"
          EXPECTED="5785bdb8091304322f597f67d50e0b79f9815cb2"
          echo "BakaSU submodule: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          git -C KernelSU cat-file -e "$EXPECTED^{commit}"
          if [ "$(git -C KernelSU rev-parse --is-shallow-repository)" = "true" ]; then
            git -C KernelSU fetch --unshallow origin
          fi
          COMMIT_COUNT="$(git -C KernelSU rev-list --count HEAD)"
          echo "BakaSU reachable commit count: $COMMIT_COUNT"
          test "$COMMIT_COUNT" = "4553"
          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"

      - name: Verify pinned SUSFS v2.2.0 source
        run: |
          # SUSFS is pinned to the GKI 5.10 upstream source commit; kernel-side hooks
          # still require the dedicated Linux 3.18 port before the files are copied.
          test -e SUSFS/.git
          ACTUAL="$(git -C SUSFS rev-parse HEAD)"
          EXPECTED="4003ecf2d01c6d13fa8edf6c4f2607365738dc3d"
          echo "SUSFS source: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          git -C SUSFS cat-file -e "$EXPECTED^{commit}"
          test -f SUSFS/kernel_patches/fs/susfs.c
          test -f SUSFS/kernel_patches/include/linux/susfs.h
          test -f SUSFS/kernel_patches/include/linux/susfs_def.h
          test -f SUSFS/50_add_susfs_in_gki-android12-5.10.patch

      - name: Notify Build Started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "parse_mode=markdown" \
          -d "text=🚀 *New version of Mimir Kernel is compiling!*%0A%0A📦 *Repo:* \`${{ env.REPO_NAME }}\` %0A📱 *Device:* ${{ env.DEVICE_NAME }} %0A🌿 *Branch:* \`${{ github.ref_name }}\` %0A🧩 *Droidspaces:* \`${{ github.event.inputs.droidspaces }}\` %0A⏳ *Please wait for completion...*" \
          -d "reply_markup={\"inline_keyboard\":[[{\"text\":\"🔍 View real-time log\",\"url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]]}"

      - name: Fetch pinned build tooling
        run: |
          git init /tmp/mimir-build-script
          git -C /tmp/mimir-build-script remote add origin https://github.com/Vhmit/mimir-build-script.git
          git -C /tmp/mimir-build-script fetch --depth=1 origin 71abd60bb5c110a6de841a799b99af6fe2fa5f46
          git -C /tmp/mimir-build-script checkout --detach FETCH_HEAD
          cp /tmp/mimir-build-script/build.sh ./build.sh

          # Replace moving branch clones inside the pinned upstream script with immutable commits.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.sh")
          script = path.read_text()
          replacements = {
              'git clone --depth=1 --single-branch -b 4.9.x-2015 https://github.com/Vhmit/platform_prebuilts_gcc "$toolchain_dir"':
              'git init "$toolchain_dir"\n        git -C "$toolchain_dir" remote add origin https://github.com/Vhmit/platform_prebuilts_gcc\n        git -C "$toolchain_dir" fetch --depth=1 origin 0d8d0f715973db533afb85725492c17c43e8dcc1\n        git -C "$toolchain_dir" checkout --detach FETCH_HEAD',
              'git clone --depth=1 --single-branch https://github.com/Vhmit/AnyKernel3.git -b "\${DEVICE}" "$anykernel"':
              'git init "$anykernel"\n        git -C "$anykernel" remote add origin https://github.com/Vhmit/AnyKernel3.git\n        git -C "$anykernel" fetch --depth=1 origin a3249880710e9702798bcb8f5211cc9f2e63e4a7\n        git -C "$anykernel" checkout --detach FETCH_HEAD',
          }
          for old, new in replacements.items():
              if old not in script:
                  raise SystemExit(f"Expected build command not found: {old}")
              script = script.replace(old, new)
          path.write_text(script)
          PY
          chmod +x ./build.sh

      - name: Run build script
        id: build
        run: |
          ARGS="${{ env.DEVICE }} -z"

          {
            echo "${{ github.event.inputs.droidspaces }}"
            echo "y"
          } | ./build.sh $ARGS 2>&1 | tee build_output.log

          clean() {
            echo "$1" | sed -r 's/\x1B\[[0-9;]*[mK]//g' | tr -d '\r'
          }

          SHA=$(clean "$(grep -oP 'SHA256 Checksum: \K.*' build_output.log | tail -1 || true)")
          [ -n "$SHA" ] && echo "ZIP_SHA256=$SHA" >> $GITHUB_ENV

          LINK=$(clean "$(grep -oP 'Download Link: \K.*' build_output.log | tail -1 || true)")
          [ -n "$LINK" ] && echo "ZIP_DOWNLOAD_LINK=$LINK" >> $GITHUB_ENV

          SERVER=$(clean "$(grep -oP 'Uploading ZIP to \K.*?(?=\.\.\.)' build_output.log | tail -1 || true)")
          [ -n "$SERVER" ] && echo "GOFILE_SERVER=$SERVER" >> $GITHUB_ENV

          TIME=$(clean "$(grep -oP 'Completed successfully in: \K.*' build_output.log | tail -1 || true)")
          [ -n "$TIME" ] && echo "BUILD_DURATION=$TIME" >> $GITHUB_ENV

          TOOLCHAIN=$(clean "$(grep -oP 'Using: \K.*' build_output.log | tail -1 || true)")
          [ -n "$TOOLCHAIN" ] && echo "TOOLCHAIN_VERSION=$TOOLCHAIN" >> $GITHUB_ENV

          ERROR_URL=$(clean "$(grep -oP 'Rustbin Log: \K.*' build_output.log | tail -1 || true)")
          [ -n "$ERROR_URL" ] && echo "ERROR_LOG_URL=$ERROR_URL" >> $GITHUB_ENV

          ZIP_FILE=$(ls *.zip 2>/dev/null | head -1)
          [ -n "$ZIP_FILE" ] && echo "ZIP_FILENAME=$ZIP_FILE" >> $GITHUB_ENV

          if ls *.zip 1> /dev/null 2>&1; then
            echo "ZIP_FOUND=true" >> $GITHUB_ENV
          else
            echo "ZIP_FOUND=false" >> $GITHUB_ENV
            exit 1
          fi

      - name: Send Notification (Success)
        if: success()
        run: |
          BTN_TEXT="📥 Download (Gofile)"
          BTN_URL="${{ env.ZIP_DOWNLOAD_LINK }}"
          SERVER_LINE=""
          if [ -n "${{ env.GOFILE_SERVER }}" ]; then
            SERVER_LINE="🌐 *Server:* \`${{ env.GOFILE_SERVER }}\` (10 days)%0A"
          fi

          MSG="✅ *New Mimir Kernel build for ${{ env.DEVICE_NAME }} available!*%0A%0A"
          MSG+="📦 *File:* \`${{ env.ZIP_FILENAME }}\`%0A"
          MSG+="🛠️ *Compiler:* \`${{ env.TOOLCHAIN_VERSION }}\`%0A"
          MSG+="⏱️ *Time:* \`${{ env.BUILD_DURATION }}\`%0A"
          MSG+="$SERVER_LINE"
          MSG+="🔐 *SHA256:* \`${{ env.ZIP_SHA256 }}\`"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=markdown" \
            -d "text=$MSG" \
            -d "reply_markup={\"inline_keyboard\":[[{\"text\":\"$BTN_TEXT\",\"url\":\"$BTN_URL\"}]]}"

      - name: Send Notification (Failure)
        if: failure()
        run: |
          [ -z "$ERROR_LOG_URL" ] && ERROR_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || ERROR_URL="$ERROR_LOG_URL"

          MESSAGE="❌ *Kernel build failed!*
          📦 *Repo:* \`${{ env.REPO_NAME }}\`
          🛠️  *Compiler:* \`${TOOLCHAIN_VERSION:-unknown}\`
          🆔 *Run ID:* ${{ github.run_id }}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=markdown" \
            -d "text=$MESSAGE" \
            -d "reply_markup={\"inline_keyboard\":[[{\"text\":\"📂 View Error Log\",\"url\":\"$ERROR_URL\"}]]}"

      - name: Send Notification (Cancelled)
        if: cancelled()
        run: |
          MESSAGE="⏹️ *Kernel build was cancelled!*
          📦 *Repo:* \`${{ env.REPO_NAME }}\`
          🌿 *Branch:* \`${{ github.ref_name }}\`
          🆔 *Run ID:* ${{ github.run_id }}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=markdown" \
            -d "text=$MESSAGE" \
            -d "reply_markup={\"inline_keyboard\":[[{\"text\":\"🔄 View / Re-run\",\"url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]]}"

      - name: Cleanup workspace
        if: always()
        run: rm -rf out gcc *.zip /tmp/mimir-build-script build_output.log
