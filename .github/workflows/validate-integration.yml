name: Validate Kernel Integration Overlay

on:
  push:
    branches:
      - integration/bakasu-35253-susfs22-nomount
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'arch/arm64/configs/deen_defconfig'
      - 'drivers/**'
      - 'fs/**'
      - 'include/linux/**'
      - '.gitmodules'
      - 'KernelSU'
      - 'SUSFS'
      - 'NoMount'
  workflow_dispatch:

concurrency:
  group: validate-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-bakasu-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned source tree
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify pinned submodules
        shell: bash
        run: |
          test "$(git -C KernelSU rev-parse HEAD)" = "5785bdb8091304322f597f67d50e0b79f9815cb2"
          test "$(git -C SUSFS rev-parse HEAD)" = "4003ecf2d01c6d13fa8edf6c4f2607365738dc3d"
          test "$(git -C NoMount rev-parse HEAD)" = "bf1847f98fed382369c43bfd652cd93774b9b8e3"
          test "$(git -C KernelSU rev-list --count HEAD)" = "4553"

      - name: Validate Python integration scripts
        run: |
          python3 -m py_compile \
            scripts/apply-bakasu-318-compat.py \
            scripts/prepare-susfs-318.py \
            scripts/stage-nomount-318.py \
            scripts/check-mimir-integration.py

      - name: Apply compatibility overlay
        run: |
          python3 scripts/apply-bakasu-318-compat.py
          git -C KernelSU diff --check

      - name: Assert Manual Hook and SUSFS coexistence
        shell: bash
        run: |
          grep -q 'bool "Enable SUSFS support"' KernelSU/kernel/Kconfig
          grep -q 'susfs_init();' KernelSU/kernel/core/init.c
          grep -q 'KSU_COMPAT_LEGACY_USERPATH' KernelSU/kernel/feature/sucompat.h
          test "$(grep -c '!defined(KSU_COMPAT_LEGACY_USERPATH)' KernelSU/kernel/feature/sucompat.c)" -eq 2
          grep -q 'susfs_compat.mk' KernelSU/kernel/Kbuild

      - name: Stage SUSFS v2.2.0 core with Linux 3.18 shims
        run: |
          python3 scripts/prepare-susfs-318.py
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          grep -q '#define SUSFS_VERSION "v2.2.0"' include/linux/susfs.h

      - name: Stage and assert NoMount Linux 3.18 adapters
        shell: bash
        run: |
          python3 scripts/stage-nomount-318.py
          test -f fs/nomount/nomount.c
          test -f fs/nomount/nomount.h
          grep -q 'default n' fs/nomount/Kconfig
          grep -q '#define NM_LINUX_318_PORT 1' fs/nomount/nomount.h
          grep -q '.follow_link = nm_follow_link' fs/nomount/nomount.c
          grep -q '.getxattr = nm_getxattr' fs/nomount/nomount.c
          grep -q 'KERNEL_VERSION(4, 7, 0)' fs/nomount/nomount.c
          grep -q 'KERNEL_VERSION(4, 7, 0)' fs/nomount/nomount.h
          ! grep -q '^CONFIG_NOMOUNT=y' arch/arm64/configs/deen_defconfig

      - name: Compile NoMount against Linux 3.18 ARM64 headers
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev
          unset O KBUILD_OUTPUT KBUILD_SRC
          make ARCH=arm64 mrproper
          OUT_DIR="$RUNNER_TEMP/mimir-nomount-build"
          rm -rf "$OUT_DIR"
          make O="$OUT_DIR" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- deen_defconfig
          if grep -q '^# CONFIG_NOMOUNT is not set$' "$OUT_DIR/.config"; then
            sed -i 's/^# CONFIG_NOMOUNT is not set$/CONFIG_NOMOUNT=y/' "$OUT_DIR/.config"
          else
            echo 'CONFIG_NOMOUNT=y' >> "$OUT_DIR/.config"
          fi
          make O="$OUT_DIR" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -q '^CONFIG_NOMOUNT=y$' "$OUT_DIR/.config"
          make O="$OUT_DIR" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 fs/nomount/nomount.o
          test -s "$OUT_DIR/fs/nomount/nomount.o"
          file "$OUT_DIR/fs/nomount/nomount.o"

      - name: Confirm shipped kernel features remain gated
        shell: bash
        run: |
          grep -q '^CONFIG_KSU=y' arch/arm64/configs/deen_defconfig
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' arch/arm64/configs/deen_defconfig
          ! grep -q '^CONFIG_KSU_SUSFS=y' arch/arm64/configs/deen_defconfig
          ! grep -q '^CONFIG_NOMOUNT=y' arch/arm64/configs/deen_defconfig
          echo "Overlay validation passed; NoMount was compiled only in the isolated validation .config."
